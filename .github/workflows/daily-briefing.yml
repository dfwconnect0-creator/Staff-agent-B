name: Daily Briefing

on:
  schedule:
    - cron: "0 5 * * *"   # 5 AM UTC = 8 AM Cairo
  workflow_dispatch:

permissions:
  contents: write

# Shared with ingest-replies.yml. Both jobs write memory/episodic/ and
# context/current_state.md and then push to main, so they must never overlap.
# cancel-in-progress MUST stay false: cancelling a half-finished run could leave
# the Telegram cursor advanced but the commit un-pushed, silently dropping a reply.
concurrency:
  group: staff-agent-memory-writes
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run python -m src.briefing
        env:
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'anthropic' }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Rebuild portfolio state
        # No LLM and no Telegram. Reads the committed per-project state files and
        # rewrites context/portfolio/current_state.md. Most project sources are local
        # to the user's machine, so this runner rebuilds from state it already has
        # rather than pretending to re-read a disk it cannot see.
        run: uv run python -m src.project_update portfolio
      - name: Send portfolio briefing
        # Runs even if the LLM briefing failed, so a provider outage never costs the
        # human their project check-in. Skips itself when the portfolio is unchanged.
        run: uv run python -m src.portfolio_briefing --send
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Commit new memory
        run: |
          git config user.name "chief-of-staff-bot"
          git config user.email "bot@users.noreply.github.com"
          git add memory/episodic/ context/current_state.md context/projects/ context/portfolio/
          git diff --staged --quiet || git commit -m "memory: briefing for $(date -u +%Y-%m-%d)"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
