name: Project Observation

# The run name is the correlation mechanism. The local watcher cannot see workflow
# inputs of runs it did not start in this process, so without a name carrying the id it
# would have to guess which run is "its" run from timing alone. Publishing the id makes
# the remote identity checkable: an exact string comparison decides, and nothing else.
run-name: project-observation-${{ inputs.correlation_id }}

on:
  workflow_dispatch:
    inputs:
      payload:
        description: "JSON payload of observations"
        required: true
        type: string
      correlation_id:
        description: "Correlation ID; becomes the run name so a dispatch can be matched exactly"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: staff-agent-memory-writes
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OBSERVATION_PAYLOAD: ${{ inputs.payload }}
      OBSERVATION_CORRELATION_ID: ${{ inputs.correlation_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - name: Apply observations
        run: uv run python -m src.project_observation apply
        env:
          OBSERVATION_PAYLOAD: ${{ env.OBSERVATION_PAYLOAD }}
          OBSERVATION_CORRELATION_ID: ${{ env.OBSERVATION_CORRELATION_ID }}
      - name: Commit changes
        run: |
          git config user.name "chief-of-staff-bot"
          git config user.email "bot@users.noreply.github.com"
          git add memory/episodic/ context/projects/ context/portfolio/
          git diff --staged --quiet || git commit -m "memory: local project observation $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
