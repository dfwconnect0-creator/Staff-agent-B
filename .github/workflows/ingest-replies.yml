name: Ingest Telegram Replies

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes (fast interactive mode)
  workflow_dispatch:

permissions:
  contents: write

# Shared with daily-briefing.yml. Both jobs write memory/episodic/ and
# context/current_state.md and then push to main, so they must never overlap.
# cancel-in-progress MUST stay false: cancelling a half-finished run could leave
# the Telegram cursor advanced but the commit un-pushed, silently dropping a reply.
concurrency:
  group: staff-agent-memory-writes
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run python -m src.ingest_replies
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Commit ingested replies
        run: |
          git config user.name "chief-of-staff-bot"
          git config user.email "bot@users.noreply.github.com"
          git add memory/episodic/ context/current_state.md context/projects/ context/portfolio/
          git diff --staged --quiet || git commit -m "memory: ingest replies $(date -u +%Y-%m-%dT%H:%M)"
          git push
