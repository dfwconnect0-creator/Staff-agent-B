[project]
name = "chief-of-staff"
version = "0.1.0"
description = "AI briefing agent"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "httpx>=0.27.0",
    "jsonschema>=4.0.0",
]

[dependency-groups]
